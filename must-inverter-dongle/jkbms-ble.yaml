external_components:
  - source: github://syssi/esphome-jk-bms@main
    refresh: 0s

esp32_ble:
  use_psram: true

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${bms_mac_addr}
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 30s
    id: bms0

binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "jkbms balancing"
    charging:
      name: "jkbms charging"
    discharging:
      name: "jkbms discharging"
    heating:
      name: "jkbms heating"
    dry_contact_1:
      name: "jkbms dry contact 1"
    dry_contact_2:
      name: "jkbms dry contact 2"

button:
