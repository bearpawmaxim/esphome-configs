substitutions:
  device_name: must-inverter-dongle
  device_name_underscore: must_inverter_dongle
  rx_pin: GPIO43
  tx_pin: GPIO44
  wdi_pin: GPIO4
  srv_led_pin: GPIO5
  net_led_pin: GPIO6
  com_led_pin: GPIO7

esphome:
  name: must-inverter-dongle
  friendly_name: must-inverter-dongle
  includes:
    - includes/bit_utils.h

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "2048"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
  flash_size: 4MB

psram:
  mode: quad
  speed: 80MHz
  ignore_not_found: false

logger:
captive_portal:
web_server:
http_request:

mqtt:
  broker: !secret ext_mqtt_broker_addr
  port: !secret ext_mqtt_broker_port
  username: !secret ext_mqtt_broker_username
  password: !secret ext_mqtt_broker_password
  certificate_authority: !secret ext_mqtt_broker_cert
  skip_cert_cn_check: false
  idf_send_async: true
  will_message:
  on_connect:
    - output.turn_on: srv_led
  on_disconnect:
    - output.turn_off: srv_led

ota:
  - platform: http_request
    id: http_ota
  - platform: esphome
    id: esphome_ota
    password: !secret ota_password

update:
  - platform: http_request
    name: Firmware Update
    source: !secret must_inverter_dongle_ota_manifest_url
    update_interval: 6h

packages:
  device_common: !include .ext_device_common.yaml
  must_modbus: !include
    file: must-inverter-dongle/must-modbus.yaml
    vars:
      tx_pin: ${tx_pin}
      rx_pin: ${rx_pin}
      com_led: com_led
  jkbms_bt: !include
    file: must-inverter-dongle/jkbms-ble.yaml
    vars:
      bms_mac_addr: !secret ch_bms_mac_addr

wifi:
  output_power: 8.5dB
  on_connect:
    - output.turn_on: net_led   
  on_disconnect:
    - output.turn_off: net_led
  ssid: !secret ch_wifi_ssid
  password: !secret ch_wifi_pass

output:
  - platform: gpio
    id: net_led
    pin:
      number: ${net_led_pin}
      inverted: true
  - platform: gpio
    id: srv_led
    pin:
      number: ${srv_led_pin}
      inverted: true
  - platform: gpio
    id: com_led
    pin:
      number: ${com_led_pin}
      inverted: true

switch:
  - platform: gpio
    id: wdi_pulse
    pin: ${wdi_pin}
    restore_mode: ALWAYS_OFF
    internal: true

interval:
  - interval: 500ms
    then:
      - switch.toggle: wdi_pulse

debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "PSRAM Free"

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

button:
  - platform: template
    name: "Update must-inverter-dongle fw"
    on_press:
      then:
        - update.check:
        - if:
            condition:
              update.is_available:
            then:
              - update.perform: